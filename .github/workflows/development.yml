name: Development
on: [push, pull_request]
jobs:
  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # Fetch full history so the linter can accurately diff the PR base
          fetch-depth: 0

      # Run on Pull Requests (diffs against the target branch)
      - name: Run golangci-lint (PR)
        if: github.event_name == 'pull_request'
        uses: golangci/golangci-lint-action@55c2c1448f86e01eaae002a5a3a9624417608d84 # v6.5.2
        with:
          version: v1.64
          args: "--new-from-rev=origin/${{ github.base_ref }} --out-format=github-actions"

      # Run on Pushes (standard run)
      - name: Run golangci-lint (Push)
        if: github.event_name == 'push'
        uses: golangci/golangci-lint-action@55c2c1448f86e01eaae002a5a3a9624417608d84 # v6.5.2
        with:
          version: v1.64
          args: "--new-from-rev=HEAD~5 -v"

  test-build-upload:
    strategy:
      matrix:
        go-version: [1.22.x, 1.24.x, 1.26.x]
        platform: [ubuntu-latest]
    runs-on: ${{ matrix.platform }}
    steps:
    - name: Checkout code
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
          fetch-depth: 0
    - name: Install Go
      uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
      with:
        go-version: ${{ matrix.go-version }}
    - name: Downgrade go.mod for Go 1.22
      if: startsWith(matrix.go-version,'1.22')
      # GOTOOLCHAIN=local prevents Go from auto-downloading 1.24
      env:
        GOTOOLCHAIN: local
      run: |
        go mod edit -go=1.22
        go mod tidy
    - name: Test
      run: go test ./... -mod=vendor
    - name: Build
      run: |
        mkdir -p output/{win,lin,arm,mac}
        VERSION=$(git describe --tags)
        GOOS=linux GOARCH=amd64 go build -mod=vendor -ldflags "-s -X main.githash=$(git log --pretty=format:'%h' -n 1)" -o output/lin/matterircd-$VERSION-linux-amd64
        GOOS=windows GOARCH=amd64 go build -mod=vendor -ldflags "-s -X main.githash=$(git log --pretty=format:'%h' -n 1)" -o output/win/matterircd-$VERSION-windows-amd64.exe
        GOOS=darwin GOARCH=amd64 go build -mod=vendor -ldflags "-s -X main.githash=$(git log --pretty=format:'%h' -n 1)" -o output/mac/matterircd-$VERSION-darwin-amd64
    - name: Upload linux 64-bit
      if: startsWith(matrix.go-version,'1.24')
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: matterircd-linux-64bit
        path: output/lin
    - name: Upload windows 64-bit
      if: startsWith(matrix.go-version,'1.24')
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: matterircd-windows-64bit
        path: output/win
    - name: Upload darwin 64-bit
      if: startsWith(matrix.go-version,'1.24')
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: matterircd-darwin-64bit
        path: output/mac
