version: 2
release:
  prerelease: auto
  name_template: "{{.ProjectName}} v{{.Version}}"

builds:
- id: matterircd
  env:
    - CGO_ENABLED=0
  flags:
    - -tags=goolm
  goos:
    - freebsd
    - windows
    - darwin
    - linux
    - dragonfly
    - netbsd
    - openbsd
  goarch:
    - amd64
    - arm
    - arm64
    - 386
  overrides:
    - goos: linux
      goarch: amd64
      env:
        - CGO_ENABLED=1
    - goos: linux
      goarch: arm64
      env:
        - CGO_ENABLED=1
        - CC=aarch64-linux-gnu-gcc
  ldflags:
    - -s -w -X main.githash={{.ShortCommit}}

archives:
  -
    id: matterircd
    ids:
    - matterircd
    name_template: "{{ .Binary }}-{{ .Version }}-{{ .Os }}-{{ .Arch }}{{ if .Arm }}v{{ .Arm }}{{ end }}"
    formats: [binary]
    files:
      - none*

checksum:
  name_template: 'checksums.txt'
